<!DOCTYPE html>
<html>
<head>
    <title>{{ meeting.title }}</title>
</head>
<body>

    <h1>{{ meeting.title }}</h1>

    <p>{{ meeting.description }}</p>

    <p>
        <strong>Created:</strong>
        {{ meeting.created_at }}
    </p>

    <p>
        <strong>Last Updated:</strong>
        {{ meeting.updated_at }}
    </p>

    <br>

    <a href="{% url 'edit_meeting' meeting.id %}">
        Edit Meeting
    </a>

    <br><br>

    <a href="{% url 'delete_meeting' meeting.id %}">
        Delete Meeting
    </a>

    <br><br>

    <a href="{% url 'dashboard' %}">
        ← Back to Dashboard
    </a>

</body>
</html>
