<!DOCTYPE html>
<html>
<head>
    <title>Edit Meeting</title>
</head>
<body>

    <h1>Edit Meeting</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ meeting.title }}"
            placeholder="Meeting title"
            required
        >

        <br><br>

        <textarea
            name="description"
            rows="5"
            placeholder="Meeting description"
        >{{ meeting.description }}</textarea>

        <br><br>

        {% if meeting.audio %}
            <h3>Current Audio</h3>

            <audio controls>
                <source src="{{ meeting.audio.url }}">
                Your browser does not support the audio player.
            </audio>

            <br><br>
        {% endif %}

        <label for="audio">Replace Meeting Audio:</label>

        <br>

        <input
            type="file"
            name="audio"
            id="audio"
            accept="audio/*"
        >

        <br><br>

        <button type="submit">
            Save Changes
        </button>
    </form>

    <br>

    <a href="{% url 'meeting_detail' meeting.id %}">
        Cancel
    </a>

</body>
</html>
