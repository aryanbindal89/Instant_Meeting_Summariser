<!DOCTYPE html>
<html>
<head>
    <title>Edit Meeting</title>
</head>
<body>

    <h1>Edit Meeting</h1>

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            value="{{ meeting.title }}"
            placeholder="Meeting title"
            required
        >

        <br><br>

        <textarea
            name="description"
            rows="5"
            placeholder="Meeting description"
        >{{ meeting.description }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'meeting_detail' meeting.id %}">
        Cancel
    </a>

</body>
</html>
